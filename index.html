<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Una pequeña sorpresa ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #1a1a24;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid #4a3b32;
      background: #87ceeb;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* Modal de la Carta */
    #letter-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    #letter-modal.active {
      display: flex;
      opacity: 1;
    }

    .letter-box {
      background: #fff8eb;
      border: 5px solid #d4a373;
      border-radius: 16px;
      padding: 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
      text-align: center;
      color: #4a3b32;
      transform: translateY(20px);
      transition: transform 0.4s ease;
    }

    #letter-modal.active .letter-box {
      transform: translateY(0);
    }

    .letter-title {
      font-size: 13px;
      color: #c94a53;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .letter-body {
      font-family: 'Quicksand', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #5c4d43;
      white-space: pre-line;
    }

    .btn-close {
      background: #e76f51;
      color: white;
      border: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px #b8533c;
    }

    .btn-close:active {
      box-shadow: 0 1px #b8533c;
      transform: translateY(3px);
    }

    /* Controles en Pantalla para Celular */
    #mobile-controls {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }

    .touch-btn {
      width: 60px;
      height: 60px;
      background: #3e322a;
      border: 3px solid #8d6e63;
      border-radius: 50%;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px #231b17;
    }

    .touch-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px #231b17;
      background: #5d4037;
    }

    @media (min-width: 800px) {
      #mobile-controls {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <!-- Modal Carta -->
    <div id="letter-modal">
      <div class="letter-box">
        <h2 class="letter-title">💌 ¡LLEGASTE AL TESORO! 💌</h2>
        <div class="letter-body" id="letterText">
Hola bonita,

Si estás leyendo esto es porque llegaste al final del camino. Quería hacerte un detalle diferente programado por mí para recordarte lo increíble que eres y lo mucho que me alegra compartir cada momento contigo.

¡Eres mi mayor tesoro! ❤️
        </div>
        <button class="btn-close" onclick="closeLetter()">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Controles táctiles -->
  <div id="mobile-controls">
    <button class="touch-btn" id="leftBtn">◀</button>
    <button class="touch-btn" id="rightBtn">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const letterModal = document.getElementById('letter-modal');

    // Estado del juego
    const keys = { left: false, right: false };
    let chestOpened = false;

    // Jugador
    const player = {
      x: 60,
      y: 320,
      width: 24,
      height: 40,
      speed: 4,
      facing: 'right',
      frame: 0,
      walkTimer: 0
    };

    // Cofre
    const chest = {
      x: 700,
      y: 330,
      width: 36,
      height: 30,
      sparkles: []
    };

    // Partículas de brillitos
    for (let i = 0; i < 15; i++) {
      chest.sparkles.push({
        x: chest.x + Math.random() * 40 - 2,
        y: chest.y + Math.random() * 30 - 10,
        size: Math.random() * 3 + 1,
        speed: Math.random() * 0.5 + 0.2,
        alpha: Math.random()
      });
    }

    // Nubes de fondo
    const clouds = [
      { x: 50, y: 50, s: 0.8 },
      { x: 300, y: 80, s: 1.2 },
      { x: 600, y: 40, s: 1.0 }
    ];

    // Eventos Teclado
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
    });

    // Eventos Táctiles
    const bindTouch = (btn, dir) => {
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[dir] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[dir] = false; });
      btn.addEventListener('mousedown', () => keys[dir] = true);
      btn.addEventListener('mouseup', () => keys[dir] = false);
    };
    bindTouch(document.getElementById('leftBtn'), 'left');
    bindTouch(document.getElementById('rightBtn'), 'right');

    function openLetter() {
      chestOpened = true;
      letterModal.classList.add('active');
    }

    function closeLetter() {
      letterModal.classList.remove('active');
    }

    function update() {
      if (!chestOpened) {
        if (keys.left && player.x > 20) {
          player.x -= player.speed;
          player.facing = 'left';
          player.walkTimer++;
        } else if (keys.right && player.x < 740) {
          player.x += player.speed;
          player.facing = 'right';
          player.walkTimer++;
        } else {
          player.walkTimer = 0;
        }

        // Colisión con cofre
        if (player.x + player.width >= chest.x - 10) {
          openLetter();
        }
      }

      // Animación de partículas del cofre
      chest.sparkles.forEach(s => {
        s.y -= s.speed;
        s.alpha -= 0.01;
        if (s.alpha <= 0) {
          s.y = chest.y + 15;
          s.x = chest.x + Math.random() * 40 - 2;
          s.alpha = 1;
        }
      });
    }

    // Dibuja el escenario Pixel Art
    function drawBackground() {
      // Cielo degradado
      let skyGrad = ctx.createLinearGradient(0, 0, 0, 360);
      skyGrad.addColorStop(0, '#74c0e3');
      skyGrad.addColorStop(1, '#c5e8f7');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, 800, 450);

      // Sol
      ctx.fillStyle = '#fff4bd';
      ctx.beginPath();
      ctx.arc(460, 90, 42, 0, Math.PI * 2);
      ctx.fill();

      // Montañas de fondo
      ctx.fillStyle = '#9cb8c9';
      ctx.beginPath();
      ctx.moveTo(350, 360);
      ctx.lineTo(520, 110);
      ctx.lineTo(690, 360);
      ctx.fill();

      // Pico nevado
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(520, 110);
      ctx.lineTo(490, 155);
      ctx.lineTo(550, 155);
      ctx.fill();

      // Nubes
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 25 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 20 * c.s, c.y - 10 * c.s, 30 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 45 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
        ctx.fill();
      });

      // Suelo / Pasto
      ctx.fillStyle = '#5b8c3d';
      ctx.fillRect(0, 360, 800, 20);

      // Tierra
      ctx.fillStyle = '#3a271d';
      ctx.fillRect(0, 380, 800, 70);

      // Bloques de detalle en tierra
      ctx.fillStyle = '#2a1a12';
      for (let i = 0; i < 800; i += 40) {
        ctx.fillRect(i + 10, 400, 16, 12);
        ctx.fillRect(i + 25, 420, 12, 10);
      }

      // Árbol decorativo izquierdo
      drawTree(90, 360);
      drawTree(220, 360);
    }

    function drawTree(x, y) {
      // Tronco
      ctx.fillStyle = '#6b472e';
      ctx.fillRect(x - 8, y - 60, 16, 60);
      // Follaje
      ctx.fillStyle = '#3c752c';
      ctx.beginPath();
      ctx.arc(x, y - 75, 35, 0, Math.PI * 2);
      ctx.arc(x - 20, y - 65, 25, 0, Math.PI * 2);
      ctx.arc(x + 20, y - 65, 25, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawChest() {
      // Brillos dorados
      chest.sparkles.forEach(s => {
        ctx.fillStyle = `rgba(255, 215, 0, ${s.alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Cuerpo cofre
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(chest.x, chest.y + 10, chest.width, chest.height - 10);

      // Tapa cofre
      if (chestOpened) {
        ctx.fillStyle = '#5c3818';
        ctx.fillRect(chest.x - 2, chest.y - 6, chest.width + 4, 12);
        // Interior con brillo
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(chest.x + 4, chest.y + 8, chest.width - 8, 8);
      } else {
        ctx.fillStyle = '#a06836';
        ctx.fillRect(chest.x, chest.y, chest.width, 12);
        // Cerradura
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(chest.x + chest.width / 2 - 3, chest.y + 9, 6, 7);
      }

      // Bordes metálicos
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(chest.x, chest.y + 10, 4, chest.height - 10);
      ctx.fillRect(chest.x + chest.width - 4, chest.y + 10, 4, chest.height - 10);
    }

    function drawPlayer() {
      const p = player;
      const walkOffset = Math.sin(p.walkTimer * 0.3) * 2;

      ctx.save();
      ctx.translate(p.x + p.width / 2, p.y + p.height);

      if (p.facing === 'left') ctx.scale(-1, 1);

      // Sombra
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(0, -2, 12, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Piernas / Pantalones
      ctx.fillStyle = '#2b4162';
      ctx.fillRect(-8, -14 + walkOffset, 6, 12);
      ctx.fillRect(2, -14 - walkOffset, 6, 12);

      // Zapatos
      ctx.fillStyle = '#1e1e24';
      ctx.fillRect(-9, -2 + walkOffset, 7, 4);
      ctx.fillRect(1, -2 - walkOffset, 7, 4);

      // Torso / Camisa
      ctx.fillStyle = '#e76f51';
      ctx.fillRect(-10, -32, 20, 18);

      // Mochila pequeña aventurera
      ctx.fillStyle = '#7f5539';
      ctx.fillRect(-14, -30, 5, 14);

      // Cabeza / Piel
      ctx.fillStyle = '#ffdbac';
      ctx.fillRect(-8, -48, 16, 16);

      // Ojo y mejilla sonrojada
      ctx.fillStyle = '#1e1e24';
      ctx.fillRect(3, -42, 3, 3);
      ctx.fillStyle = 'rgba(255, 100, 100, 0.5)';
      ctx.fillRect(2, -37, 4, 2);

      // Cabello
      ctx.fillStyle = '#4a2810';
      ctx.fillRect(-9, -51, 18, 6);
      ctx.fillRect(-10, -48, 4, 8);

      ctx.restore();
    }

    function loop() {
      update();
      drawBackground();
      drawChest();
      drawPlayer();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
